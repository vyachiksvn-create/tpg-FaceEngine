[build-system]
requires = ["setuptools>=75.6", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "feature"
version = "0.1.0-alpha"
description = "Платформа для распознавания лиц с модульной архитектурой"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "feature Team" }
]
keywords = ["face", "recognition", "insightface", "faiss", "sqlite"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "sqlalchemy==2.0.36",
    "alembic==1.13.3",
    "insightface==0.7.3",
    "faiss-cpu==1.9.0.post1",
    "pyyaml==6.0.2",
    "loguru==0.7.3",
    "click==8.1.7",
    "pillow==10.4.0",
    "numpy==1.26.4",
    "python-dotenv==1.0.1",
    "opencv-python==4.10.0.84",
    "scikit-image==0.24.0",
    "tqdm==4.67.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov==5.0.0",
    "black==24.10.0",
    "ruff==0.8.4",
    "mypy==1.13.0",
]
gui = [
    "pyside6==6.7.3",
]

[project.scripts]
feature = "feature.cli:main"

[project.urls]
Homepage = "https://github.com/feature/feature"
Documentation = "https://feature.readthedocs.io"
Repository = "https://github.com/feature/feature"

[tool.setuptools.packages.find]
where = ["."]
include = ["feature*"]

[tool.setuptools.package-data]
feature = ["py.typed", "*.yaml", "profiles/*.json"]

[tool.black]
line-length = 120
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
