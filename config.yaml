version: "1.0"
active_profile: "production"
paths:
  workspace: "D:\\FaceEngine"
  base_photos: "D:\\FaceEngine\\Base"
  incoming: "D:\\FaceEngine\\Inbox"
  rejected: "D:\\FaceEngine\\Reject"
  export: "D:\\FaceEngine\\Matches"
  logs: "D:\\FaceEngine\\Workspace\\logs"
  backup: "D:\\FaceEngine\\Workspace\\backup"
  temp: "D:\\FaceEngine\\Workspace\\temp"
  thumbnails: "D:\\FaceEngine\\Workspace\\cache"
recognition:
  engine: "insightface"
  model: "buffalo_l"
  threshold: 0.1938
  max_faces_per_image: 5
  use_gpu: false
search:
  index_type: "flat"
  top_k: 10
  merge_strategy: "hybrid"
import:
  check_duplicates: true
  compute_sha256: true
  save_thumbnails: true
  auto_rotate: true
  auto_contrast: false
  quality_check: true
quality:
  min_face_size: 80
  max_blur_threshold: 100.0
  max_yaw_angle: 30.0
  max_pitch_angle: 20.0
  min_confidence: 0.5
gui:
  theme: "system"
  view_mode: "cards"
  thumbnail_size: 256
  language: "ru"
performance:
  import_threads: 4
  cache_size: 1000
  auto_build_index: true
database:
  echo: false
  pool_size: 5
  max_overflow: 10
backup:
  enabled: true
  max_backups: 10
  compress: true
