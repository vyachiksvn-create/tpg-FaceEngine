# FaceArchive Configuration
# Версия конфигурации
version: "1.0"

# Пути
paths:
  workspace: "D:/FaceArchive/Workspace"
  base_photos: "D:/Faces"
  incoming: "D:/Incoming"
  rejected: "D:/FaceArchive/Workspace/Rejected"
  export: "D:/FaceArchive/Workspace/Export"
  logs: "D:/FaceArchive/Workspace/Logs"
  backup: "D:/FaceArchive/Workspace/Backup"
  temp: "D:/FaceArchive/Workspace/Temp"
  thumbnails: "D:/FaceArchive/Workspace/Thumbnails"

# Профили
profiles:
  default:
    name: "По умолчанию"
    description: "Сбалансированные настройки для ежедневного использования"
    recognition:
      engine: "insightface"
      model: "buffalo_l"
      threshold: 0.6
      max_faces_per_image: 5
      use_gpu: false
    search:
      index_type: "flat"
      top_k: 10
      merge_strategy: "hybrid"
    import:
      check_duplicates: true
      compute_sha256: true
      save_thumbnails: true
      auto_rotate: true
      auto_contrast: false
      quality_check: true
    quality:
      min_face_size: 80
      max_blur_threshold: 100.0
      max_yaw_angle: 30.0
      max_pitch_angle: 20.0
      min_confidence: 0.5
    gui:
      theme: "system"
      view_mode: "cards"
      thumbnail_size: 256
      language: "ru"
    performance:
      import_threads: 4
      cache_size: 1000
      auto_build_index: true

  expert:
    name: "Эксперт"
    description: "Максимальная детализация и контроль"
    recognition:
      engine: "insightface"
      model: "buffalo_l"
      threshold: 0.55
      max_faces_per_image: 10
      use_gpu: true
    search:
      index_type: "flat"
      top_k: 20
      merge_strategy: "hybrid"
    import:
      check_duplicates: true
      compute_sha256: true
      save_thumbnails: true
      auto_rotate: true
      auto_contrast: true
      quality_check: true
    quality:
      min_face_size: 64
      max_blur_threshold: 150.0
      max_yaw_angle: 45.0
      max_pitch_angle: 30.0
      min_confidence: 0.4
    gui:
      theme: "dark"
      view_mode: "expert"
      thumbnail_size: 512
      language: "ru"
    performance:
      import_threads: 8
      cache_size: 5000
      auto_build_index: true

  fast:
    name: "Быстрый"
    description: "Максимальная скорость импорта"
    recognition:
      engine: "insightface"
      model: "buffalo_s"
      threshold: 0.6
      max_faces_per_image: 5
      use_gpu: false
    search:
      index_type: "flat"
      top_k: 5
      merge_strategy: "max"
    import:
      check_duplicates: true
      compute_sha256: true
      save_thumbnails: true
      auto_rotate: true
      auto_contrast: false
      quality_check: false
    quality:
      min_face_size: 100
      max_blur_threshold: 80.0
      max_yaw_angle: 20.0
      max_pitch_angle: 15.0
      min_confidence: 0.6
    gui:
      theme: "system"
      view_mode: "table"
      thumbnail_size: 128
      language: "ru"
    performance:
      import_threads: 8
      cache_size: 1000
      auto_build_index: true

# Текущий активный профиль
active_profile: "default"

# Плагины
plugins:
  recognition:
    - insightface
  search:
    - faiss
  import:
    - basic

# Логирование
logging:
  level: "INFO"
  rotation: "10 MB"
  retention: "30 days"
  encoding: "utf-8"

# База данных
database:
  echo: false
  pool_size: 5
  max_overflow: 10

# Резервное копирование
backup:
  auto_backup: true
  interval_hours: 24
  keep_last: 7